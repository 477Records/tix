<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>A gift for you · Two Feet at the Greek</title>
<style>
  :root { --bg:#120d0b; --fg:#f6f2ee; --muted:#b8a99d; --accent:#ff6a2b; }
  * { box-sizing:border-box; margin:0; }
  body { background:#2a2420; color:var(--fg); font:16px/1.45 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; padding:24px 16px 48px; }
  .card { width:100%; max-width:5in; aspect-ratio:5/7; margin:0 auto; background:var(--bg); border-radius:8px; padding:9% 9% 8%;
          display:flex; flex-direction:column; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.5); }
  .kicker { font-size:13px; letter-spacing:.22em; text-transform:uppercase; color:var(--muted); }
  h1 { font-size:clamp(30px, 9vw, 46px); line-height:1.05; font-weight:700; letter-spacing:-.01em; margin-top:auto; }
  h1 span { display:block; font-size:.5em; font-weight:400; color:var(--muted); letter-spacing:0; margin-bottom:10px; }
  .where { margin-top:18px; font-size:18px; }
  .when { color:var(--muted); margin-top:4px; }
  .lines { margin-top:auto; text-align:left; font-size:14px; color:var(--muted); }
  .lines div { border-bottom:1px solid rgba(246,242,238,.35); padding:18px 0 6px; }
  .note { margin-top:14px; font-size:11px; color:var(--muted); opacity:.75; }
  .tools { max-width:5in; margin:22px auto 0; text-align:center; color:#d8ccc2; font-size:14px; }
  button { margin-top:10px; padding:14px 28px; border:0; border-radius:999px; background:var(--accent); color:#120d0b; font:700 16px/1 inherit; cursor:pointer; }
  @page { size:5in 7in; margin:0; }
  @media print {
    body { background:#fff; padding:0; }
    .tools { display:none; }
    .card { max-width:none; width:5in; height:7in; border-radius:0; box-shadow:none; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }
</style>
</head>
<body>
  <div class="card">
    <p class="kicker">A gift for you</p>
    <h1><span>you're going to see</span>Two Feet<br>at the Greek</h1>
    <p class="where">Greek Theatre · Los Angeles</p>
    <p class="when">Saturday, June 26, 2027<br>doors 6:30 PM · show 8 PM</p>
    <div class="lines">
      <div>To</div>
      <div>From</div>
    </div>
    <p class="note">This card is not a ticket. Your tickets are with the person who gave you this.</p>
  </div>
  <div class="tools">
    <p>Print this card, write two names on it, and put it under the tree.</p>
    <button onclick="window.print()">Print the card</button>
  </div>
</body>
</html>
